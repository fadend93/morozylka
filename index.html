<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Морозилка">
<title>Морозилка — каталог напівфабрикатів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Commissioner:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --frost:#E7EDF1;
  --card:#FFFFFF;
  --ink:#0E1B24;
  --ink-2:#33495A;
  --muted:#6B8195;
  --line:#D2DEE6;
  --line-soft:#E4EBF0;
  --gb:#C0402A;
  --su:#186354;
  --cold:#0B5A82;
  --warn:#8A6A1F;
  --r:14px;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--frost);
  color:var(--ink);
  font-family:"Commissioner",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── шапка ───────────────────────────────── */
.top{
  background:var(--ink);color:#EDF3F7;
  padding:calc(14px + env(safe-area-inset-top)) var(--pad) 14px;
}
.wordmark{
  font-family:"Unbounded",sans-serif;font-weight:700;
  font-size:19px;letter-spacing:-.02em;margin:0;
}
.wordmark span{color:#5FA9CE}
.sub{
  font-family:"JetBrains Mono",monospace;font-size:11px;
  color:#8FA9BB;margin-top:3px;letter-spacing:.02em;
}

/* ── панель фільтрів ─────────────────────── */
.controls{
  position:sticky;top:44px;z-index:20;
  background:rgba(231,237,241,.94);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px var(--pad) 8px;
}
.searchrow{display:flex;gap:8px;align-items:center}
.search{
  flex:1;min-width:0;appearance:none;
  border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);
  padding:9px 12px;font:inherit;font-size:15px;
}
.search:focus{outline:2px solid var(--cold);outline-offset:-1px;border-color:transparent}
.search::placeholder{color:var(--muted)}
.sortbtn{
  flex:none;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink-2);
  padding:9px 11px;font-family:"JetBrains Mono",monospace;font-size:12px;
  cursor:pointer;
}
.sortbtn:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.chipwrap{position:relative}
.chipwrap::after{
  content:"";position:absolute;right:0;top:0;bottom:2px;width:28px;
  background:linear-gradient(90deg,transparent,rgba(231,237,241,.96));
  pointer-events:none;
}
.chiprow{
  display:flex;gap:6px;overflow-x:auto;margin-top:8px;
  scrollbar-width:none;padding-bottom:2px;
}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);border-radius:100px;
  background:var(--card);color:var(--ink-2);
  padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.gb[aria-pressed="true"]{background:var(--gb);border-color:var(--gb)}
.chip.su[aria-pressed="true"]{background:var(--su);border-color:var(--su)}
.chip.fav[aria-pressed="true"]{background:var(--cold);border-color:var(--cold)}
.chip:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.chip .n{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.6;margin-left:5px}

.tally{
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);
  margin-top:8px;display:flex;justify-content:space-between;gap:10px;
}
.tally b{font-weight:500;color:var(--ink-2)}

/* ── сітка ───────────────────────────────── */
.grid{padding:12px var(--pad) 0;display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr;max-width:1180px;margin:0 auto}}

.card{
  position:relative;background:var(--card);border-radius:var(--r);
  border:1px solid var(--line-soft);
  padding:12px 12px 0 15px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.card.gb::before{background:var(--gb)}
.card.su::before{background:var(--su)}
.card:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
@media(hover:hover){.card:hover{border-color:var(--line)}}

.chead{display:flex;align-items:flex-start;gap:8px}
.cthumb{
  width:calc(100% + 27px);margin:-12px -12px 10px -15px;aspect-ratio:16/10;
  overflow:hidden;background:var(--frost);
}
.cthumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{
  flex:none;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;
  padding:2px 5px;border-radius:4px;letter-spacing:.04em;margin-top:2px;
}
.badge.gb{background:#F7E4E0;color:var(--gb)}
.badge.su{background:#DFEDE9;color:var(--su)}
.cname{flex:1;font-weight:600;font-size:15px;line-height:1.3;margin:0;letter-spacing:-.01em}
.heart{
  flex:none;border:0;background:none;padding:0 0 0 4px;margin:-2px -2px 0 0;
  font-size:17px;line-height:1;cursor:pointer;color:var(--line);
}
.heart[aria-pressed="true"]{color:var(--gb)}
.heart:focus-visible{outline:2px solid var(--cold);outline-offset:2px;border-radius:4px}

.pack{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin-top:5px}

.price{display:flex;align-items:baseline;gap:7px;margin-top:9px}
.price .big{font-family:"Unbounded",sans-serif;font-weight:500;font-size:25px;letter-spacing:-.03em}
.price .cur{font-size:15px;font-weight:500;color:var(--ink-2)}
.price .per{font-size:11.5px;color:var(--muted);font-family:"JetBrains Mono",monospace}

/* ── етикетка (підпис знизу картки) ──────── */
.label{
  margin:11px -12px 0 -15px;padding:8px 12px 9px 15px;
  border-top:1px solid var(--line-soft);background:#F7FAFC;
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-2);
  margin-top:auto;
}
.label .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.macro{display:flex;gap:9px}
.macro i{font-style:normal}
.macro i b{font-weight:700;color:var(--ink)}
.bar{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:6px;background:var(--line-soft)}
.bar span{display:block;height:100%}
.bar .p{background:#1B6E5A}
.bar .f{background:#C89A2B}
.bar .c{background:#4E86A8}
.nodata{
  color:var(--warn);border-bottom:1px dashed currentColor;
  padding-bottom:1px;cursor:help;
}

.empty{
  padding:44px 20px;text-align:center;color:var(--muted);
  grid-column:1/-1;
}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ── картка деталей ──────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(14,27,36,.5);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--card);border-radius:18px 18px 0 0;
  max-height:88vh;overflow-y:auto;
  padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px rgba(14,27,36,.22);
}
.sheet.on{transform:translateY(0)}
@media(min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:82vh;
    border-radius:16px;transform:translate(-50%,-46%) scale(.97);opacity:0;}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
@media(min-width:700px){.grab{display:none}}
.sthumb{
  width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;
  margin-top:2px;background:var(--frost);
}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.shead{position:sticky;top:0;z-index:1;background:var(--card);padding:8px 0 12px;border-bottom:1px solid var(--line-soft)}
.stitle{font-size:19px;font-weight:700;margin:6px 0 0;letter-spacing:-.02em;line-height:1.25}
.sclose{
  position:absolute;right:12px;top:12px;z-index:2;width:30px;height:30px;border-radius:50%;
  border:0;background:var(--frost);color:var(--ink-2);font-size:16px;cursor:pointer;line-height:1;
}
.sclose:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.facts{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);
  border-radius:10px;overflow:hidden;margin-top:14px;
}
.fact{background:var(--card);padding:9px 11px}
.fact dt{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.fact dd{margin:2px 0 0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}

.nutri{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.nutri caption{
  text-align:left;font-family:"JetBrains Mono",monospace;font-size:10.5px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;
}
.nutri th,.nutri td{padding:6px 0;border-bottom:1px solid var(--line-soft);text-align:right}
.nutri th{text-align:left;font-weight:500;color:var(--ink-2)}
.nutri td{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.nutri tr:last-child th,.nutri tr:last-child td{border-bottom:0}
.nutri .hi td,.nutri .hi th{font-weight:700;color:var(--ink)}

.sec{margin-top:16px}
.sec h4{
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px;font-weight:500;
}
.sec p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-2)}

.note{
  margin-top:14px;padding:9px 11px;border-radius:9px;
  background:#FBF4E3;border:1px solid #EBDCB8;color:#6E5518;font-size:13px;line-height:1.45;
}
.buy{
  display:block;margin-top:18px;text-align:center;text-decoration:none;
  background:var(--ink);color:#fff;border-radius:11px;padding:13px;
  font-weight:600;font-size:15px;
}
.buy.gb{background:var(--gb)}
.buy.su{background:var(--su)}
.buy:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.terms{font-size:11.5px;color:var(--muted);margin:8px 0 0;text-align:center;line-height:1.4}

.foot{
  padding:26px var(--pad) 8px;text-align:center;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);line-height:1.6;
}

/* ── вкладки ─────────────────────────────── */
.tabs{
  display:flex;position:sticky;top:0;z-index:22;
  background:var(--ink);padding:0 var(--pad);
}
.tab{
  flex:1;border:0;background:none;color:#8FA9BB;
  font:inherit;font-weight:600;font-size:14px;
  padding:12px 4px 11px;cursor:pointer;
  border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--cold)}
.tab:focus-visible{outline:2px solid var(--cold);outline-offset:-2px}
.tabn{font-family:"JetBrains Mono",monospace;font-size:11px;color:#5FA9CE;margin-left:4px}

/* ── морозилка (комора) ──────────────────── */
.roombar{
  padding:11px var(--pad);font-size:13px;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:rgba(231,237,241,.94);border-bottom:1px solid var(--line);
}
.roombar b{font-family:"JetBrains Mono",monospace;font-weight:700}
.linklike{
  border:0;background:none;color:var(--cold);font:inherit;font-weight:600;
  padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
}
.linklike:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

#pantryList{padding:10px 0 8px}
.pantry-row{
  background:var(--card);
  border:1px solid var(--line-soft);border-left:4px solid var(--line);
  border-radius:12px;padding:12px 13px;margin:0 var(--pad) 8px;
}
.pantry-row.gb{border-left-color:var(--gb)}
.pantry-row.su{border-left-color:var(--su)}
.prow-head{display:flex;align-items:flex-start;gap:8px}
.pbadge{flex:none;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px}
.pname{flex:1;font-weight:600;font-size:14.5px;line-height:1.32}
.pgrams{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:6px}
.pgrams.low{color:#B4471F;font-weight:700}
.pactions{display:flex;gap:6px;margin-top:10px}
.pbtn{
  flex:1;border:1px solid var(--line);background:var(--frost);color:var(--ink-2);
  border-radius:8px;padding:8px 6px;font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;font-family:inherit;
}
.pbtn:focus-visible{outline:2px solid var(--cold);outline-offset:1px}
.pbtn.del{flex:none;width:38px;color:#B4471F;border-color:#EBD3C8;background:#FBF0EA}

.addpantry{
  display:block;width:100%;margin-top:10px;text-align:center;
  background:var(--frost);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:12px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:inherit;
}
.addpantry:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.addpantry[disabled]{opacity:.7}

/* ── тиждень ─────────────────────────────── */
.weeknav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px var(--pad) 4px;
}
.weeklabel{font-weight:600;font-size:15px}
.wnbtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;line-height:1;font-family:inherit;
}
.wnbtn:focus-visible{outline:2px solid var(--cold);outline-offset:1px}

.daychip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 14px;line-height:1.15;font-size:11px}
.daychip .daynum{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700}
.daychip.today{border-color:var(--cold);border-width:1.5px}
.daychip.today:not([aria-pressed="true"]) .daynum{color:var(--cold)}

#dayContent{padding:6px var(--pad) 24px}
.mealblock{margin-top:16px}
.mealblock:first-child{margin-top:4px}
.mealhead{
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
}
.mealrow{
  display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line-soft);border-radius:10px;padding:9px 10px;margin-bottom:6px;
}
.eatbtn{border:0;background:none;font-size:17px;padding:0;cursor:pointer;color:var(--ink-2);line-height:1}
.eatbtn:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.mealname{flex:1;font-size:14px;font-weight:500}
.mealname.done{color:var(--muted);text-decoration:line-through}
.mealdel{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 4px;cursor:pointer;font-family:inherit}
.addmeal{
  width:100%;border:1px dashed var(--line);background:none;color:var(--cold);
  border-radius:10px;padding:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.daytotal{
  margin-top:18px;padding:12px 13px;background:var(--ink);color:#EDF3F7;
  border-radius:11px;font-size:13.5px;
}
.daytotal b{font-family:"JetBrains Mono",monospace;font-size:16px;color:#fff}

/* сегменти «з морозилки / гарнір» у нижній картці */
.segrow{display:flex;gap:6px;margin-top:14px}
.segbtn{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  border-radius:9px;padding:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.segbtn.active{background:var(--ink);border-color:var(--ink);color:#fff}

.hint{color:var(--muted);font-size:13.5px;padding:16px 4px;text-align:center}
.pickrow{border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px;margin-top:8px}
.pickname{font-weight:600;font-size:14px}
.pickrem{font-weight:400;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11.5px}
.pickqty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qbtn{
  border:1px solid var(--line);background:var(--frost);color:var(--ink);
  width:30px;height:30px;border-radius:8px;font-size:16px;cursor:pointer;line-height:1;font-family:inherit;flex:none;
}
.qval{flex:1;text-align:center;font-size:13px;color:var(--ink-2)}
.qval b{font-family:"JetBrains Mono",monospace;color:var(--ink)}
.qadd{
  display:block;width:100%;margin-top:8px;text-align:center;
  border:0;background:var(--cold);color:#fff;border-radius:8px;
  padding:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}

.newside{
  width:100%;margin-top:10px;border:1px dashed var(--line);background:none;color:var(--cold);
  border-radius:9px;padding:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.sideform{margin-top:10px;padding:12px;background:var(--frost);border-radius:11px}
.sfield{
  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);
  padding:8px 10px;font:inherit;font-size:14px;margin-top:6px;
}
.sideform>.sfield:first-child{margin-top:0}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sgrid .sfield{margin-top:0}

/* ── закупівля ───────────────────────────── */
.shopintro{padding:12px var(--pad) 2px}
#shopList{padding:8px var(--pad) 4px}
.shopcat{margin-top:14px}
.shopcat:first-child{margin-top:2px}
.shoprow{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line-soft);border-left:4px solid var(--line);
  border-radius:10px;padding:9px 10px;margin-bottom:6px;
}
.shoprow.gb{border-left-color:var(--gb)}
.shoprow.su{border-left-color:var(--su)}
.shopname{flex:1;font-size:13.5px;font-weight:500;min-width:0}
.pickqty.small{gap:6px;margin-top:0}
.pickqty.small .qbtn{width:26px;height:26px;font-size:14px}
.pickqty.small .qval{flex:none;font-size:12.5px;min-width:22px;text-align:center}
.shopsum{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink-2);flex:none;min-width:50px;text-align:right}

#shopSummary{padding:6px var(--pad) 24px}
.shopsummary{
  margin-top:12px;padding:13px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--line-soft);border-left:4px solid var(--line);
}
.shopsummary.gb{border-left-color:var(--gb)}
.shopsummary.su{border-left-color:var(--su)}
.ssname{font-weight:700;font-size:14.5px}
.sstotal{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;margin-top:4px}
.sscount{font-family:inherit;font-size:12px;font-weight:400;color:var(--muted)}
.ssnote{font-size:12.5px;margin-top:5px;font-weight:600}
.ssnote.warn{color:#8A6A1F}
.ssnote.ok{color:#1B6E5A}
.ssactions{display:flex;gap:8px;margin-top:11px}
.ssactions .buy{flex:1;margin-top:0;padding:10px}
.ssclear{
  flex:none;border:1px solid var(--line);background:var(--frost);color:var(--ink-2);
  border-radius:11px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}

const SUPABASE_URL = "https://oemtatnfceeixqdkjzdn.supabase.co";

const ROOMKEY = 'morozylka.room';
const getRoom = () => (localStorage.getItem(ROOMKEY) || '').trim();
function setRoom(v){
  v = (v || '').trim();
  if (v) localStorage.setItem(ROOMKEY, v); else localStorage.removeItem(ROOMKEY);
}
function pgHeaders(extra){
  return Object.assign({
    apikey: SUPABASE_KEY,
    Authorization: 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
  }, extra || {});
}
async function pg(path, opts){
  opts = opts || {};
  const res = await fetch(SUPABASE_URL + '/rest/v1' + path, Object.assign({}, opts, {
    headers: pgHeaders(opts.headers)
  }));
  if (!res.ok) throw new Error('sb ' + res.status + ': ' + (await res.text()).slice(0, 200));
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

const findCatalogItem = id => ITEMS.find(i => i.id === id);

async function loadPantry(){
  const room = getRoom(); if (!room) return;
  try{
    const rows = await pg('/mrz_pantry?room=eq.' + encodeURIComponent(room) + '&order=updated_at.desc&select=*');
    pantry = rows;
    savePantryCache();
  }catch(e){ console.warn('pantry pull failed', e); }
}
async function addToPantry(itemId){
  const it = findCatalogItem(itemId); if (!it) return;
  const existing = pantry.find(p => p.item_id === itemId);
  if (existing){ await adjustPantryGrams(existing, it.packWeight); return; }
  const room = getRoom();
  const draft = {item_id:itemId, grams_left:it.packWeight, bought_at:todayISO(), updated_at:new Date().toISOString()};
  if (room){
    try{
      const saved = await pg('/mrz_pantry', {method:'POST', headers:{Prefer:'return=representation'},
        body: JSON.stringify(Object.assign({room}, draft))});
      pantry.unshift(saved[0]);
    }catch(e){ console.warn('pantry add sync failed', e); pantry.unshift(Object.assign({id:'local-'+Date.now()}, draft)); }
  } else {
    pantry.unshift(Object.assign({id:'local-'+Date.now()}, draft));
  }
  savePantryCache(); renderPantry();
}
async function adjustPantryGrams(row, delta){
  row.grams_left = Math.max(0, row.grams_left + delta);
  row.updated_at = new Date().toISOString();
  const room = getRoom();
  if (room && !String(row.id).startsWith('local-')){
    try{ await pg('/mrz_pantry?id=eq.'+row.id, {method:'PATCH',
      body: JSON.stringify({grams_left: row.grams_left, updated_at: row.updated_at})}); }
    catch(e){ console.warn('pantry adjust sync failed', e); }
  }
  savePantryCache(); renderPantry();
}
async function removeFromPantry(row){
  pantry = pantry.filter(p => p.id !== row.id);
  const room = getRoom();
  if (room && !String(row.id).startsWith('local-')){
    try{ await pg('/mrz_pantry?id=eq.'+row.id, {method:'DELETE'}); }
    catch(e){ console.warn('pantry remove sync failed', e); }
  }
  savePantryCache(); renderPantry();
}

       +(fav.has(it.id)?'♥':'♡')+'</button>'
    +'</div>'
    +'<div class="pack">'+packG+' · '+money(it.packPrice)+' ₴ · '+Math.round(it.pricePerKg)+' ₴/кг</div>'

      +'<span class="per">за порцію '+it.portion+' г · '+(Math.round(it._portions*10)/10)+' порц. з пачки</span></div>'
    +'<div class="label">'+lab+'</div>';

  el.querySelector('.heart').onclick=e=>{
    e.stopPropagation();

    +'<button class="sclose" type="button" aria-label="Закрити">✕</button>'
    +(it.photo ? '<div class="sthumb"><img src="'+it.photo+'" alt="" loading="lazy" onerror="this.closest(\'.sthumb\').remove()"></div>' : '')

      +'<div class="fact"><dt>Пачка</dt><dd>'+money(it.packPrice)+' ₴ · '+(it.packWeight>=1000?(it.packWeight/1000)+' кг':it.packWeight+' г')+'</dd></div>'
      +'<div class="fact"><dt>За кілограм</dt><dd>'+Math.round(it.pricePerKg)+' ₴</dd></div>'
      +'<div class="fact"><dt>Порцій з пачки</dt><dd>'+(Math.round(it._portions*10)/10)+'</dd></div>'
    +'</dl>'

    +(it.composition?'<div class="sec"><h4>Склад</h4><p>'+esc(it.composition)+'</p></div>':'')
    +(it.cooking?'<div class="sec"><h4>Приготування</h4><p>'+esc(it.cooking)+'</p></div>':'')

function render(){

       (state.prod==='all'||i.producer===state.prod)

      frag.append(el); return;

      '<div class="prow-head"><span class="pbadge">'+PROD[it.producer].short+'</span>'
      +'<span class="pname">'+esc(it.name)+'</span></div>'

        +'<button class="pbtn del" type="button" data-a="del">✕</button>'
      +'</div>';
    el.querySelector('[data-a="minus"]').onclick=()=>adjustPantryGrams(row, -it.portion);
    el.querySelector('[data-a="plus"]').onclick=()=>adjustPantryGrams(row, it.packWeight);
    el.querySelector('[data-a="del"]').onclick=()=>removeFromPantry(row);
    frag.append(el);
  });
  root.append(frag);
}

/* ── тиждень: дати ───────────────────────── */
const MEALS = [['breakfast','Сніданок'],['lunch','Обід'],['dinner','Вечеря']];
function mondayOf(d){
  const x = new Date(d); const day = (x.getDay()+6)%7;
  x.setDate(x.getDate()-day); x.setHours(0,0,0,0);
  return x;
}
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const isoDate = d => d.toISOString().slice(0,10);
function fmtDayLabel(d){
  const days=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
  const months=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  return {dow:days[d.getDay()], dm:d.getDate()+' '+months[d.getMonth()]};
}
let weekStart = mondayOf(new Date());
let selectedDate = isoDate(new Date());
let currentAddMeal = null;

function renderWeekNav(){
  const end = addDays(weekStart,6);
  $('#weekLabel').textContent = fmtDayLabel(weekStart).dm+' – '+fmtDayLabel(end).dm;
  const todayIso = isoDate(new Date());
  const row = $('#dayChips'); row.innerHTML='';
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i), iso = isoDate(d), lbl = fmtDayLabel(d);
    const btn = document.createElement('button');
    btn.className='chip daychip'+(iso===todayIso?' today':'');
    btn.type='button';
    btn.setAttribute('aria-pressed', String(iso===selectedDate));
    btn.innerHTML = lbl.dow+'<span class="daynum">'+d.getDate()+'</span>';
    btn.onclick=()=>{ selectedDate=iso; renderWeekNav(); renderDay(); };
    row.append(btn);
  }
}
function entryInfo(e){
  if (e.ref_type==='item'){
    const it = findCatalogItem(e.ref_id);
    if (!it) return {name:'Позицію прибрано з каталогу', ok:false};
    const n = it.nutrition100;
    return { name:it.name, ok:!!n,
      kcal:n?n.kcal*e.grams/100:0, protein:n?n.protein*e.grams/100:0,
      fat:n?n.fat*e.grams/100:0, carbs:n?n.carbs*e.grams/100:0 };
  }
  const sd = sides.find(s => s.id===e.ref_id);
  if (!sd) return {name:'Гарнір видалено', ok:false};
  const has = sd.kcal_100!=null;
  return { name:sd.name, ok:has,
    kcal:has?sd.kcal_100*e.grams/100:0, protein:has?(sd.protein_100||0)*e.grams/100:0,
    fat:has?(sd.fat_100||0)*e.grams/100:0, carbs:has?(sd.carbs_100||0)*e.grams/100:0 };
}
function renderDay(){
  const root = $('#dayContent');
  const dayEntries = menu.filter(m => m.date===selectedDate);
  const totals = {kcal:0,protein:0,fat:0,carbs:0};
  let html='';
  MEALS.forEach(([key,label])=>{
    const entries = dayEntries.filter(m => m.meal===key);
    html += '<div class="mealblock"><div class="mealhead">'+label+'</div>';
    entries.forEach(e=>{
      const info = entryInfo(e);
      if (info.ok){ totals.kcal+=info.kcal; totals.protein+=info.protein; totals.fat+=info.fat; totals.carbs+=info.carbs; }
      html += '<div class="mealrow">'
        +'<button class="eatbtn" type="button" data-id="'+e.id+'" aria-pressed="'+!!e.eaten+'">'+(e.eaten?'☑':'☐')+'</button>'
        +'<span class="mealname'+(e.eaten?' done':'')+'">'+esc(info.name)+' · '+e.grams+' г</span>'
        +'<button class="mealdel" type="button" data-id="'+e.id+'">✕</button>'
      +'</div>';
    });
    html += '<button class="addmeal" type="button" data-meal="'+key+'">+ додати</button></div>';
  });
  html += '<div class="daytotal">Разом за день (на двох) · <b>'+Math.round(totals.kcal)+'</b> ккал'
    +' · Б'+Math.round(totals.protein)+' Ж'+Math.round(totals.fat)+' В'+Math.round(totals.carbs)+'</div>';
  root.innerHTML = html;
  root.querySelectorAll('.eatbtn').forEach(b => b.onclick=()=>toggleEaten(b.dataset.id));
  root.querySelectorAll('.mealdel').forEach(b => b.onclick=()=>removeMenuEntry(b.dataset.id));
  root.querySelectorAll('.addmeal').forEach(b => b.onclick=()=>openAddMealSheet(b.dataset.meal));
}
$('#weekPrev').onclick=()=>{ weekStart=addDays(weekStart,-7); selectedDate=isoDate(weekStart); renderWeekNav(); renderDay(); };
$('#weekNext').onclick=()=>{ weekStart=addDays(weekStart,7); selectedDate=isoDate(weekStart); renderWeekNav(); renderDay(); };

function pantryPickerRow(pantryRow, it){

    +'<div class="pickname">'+esc(it.name)+'<span class="pickrem"> · лишилось '+pantryRow.grams_left+' г</span></div>'

    +'<button class="qadd" type="button">Додати</button>'

function wireItemPicker(container){
  container.querySelectorAll('.pickrow[data-pid]').forEach(row=>{
    const step = parseFloat(row.dataset.step);
    row.querySelectorAll('.qbtn').forEach(b=>{
      b.onclick=()=>{
        const mult = Math.max(1, parseInt(row.dataset.mult)+parseInt(b.dataset.d));
        row.dataset.mult = mult;
        row.querySelector('.qmult').textContent = mult;
        row.querySelector('.qgrams').textContent = Math.round(mult*step);
      };
    });
    row.querySelector('.qadd').onclick=()=>addMenuEntry('item', row.dataset.pid, parseInt(row.dataset.mult)*step);
  });

function sidePickerRow(side){
  return '<div class="pickrow" data-sid="'+side.id+'" data-grams="'+side.default_grams+'">'
    +'<div class="pickname">'+esc(side.name)+'</div>'
    +'<div class="pickqty">'
      +'<button class="qbtn" type="button" data-d="-50">−</button>'
      +'<span class="qval"><b class="qgrams">'+side.default_grams+'</b> г</span>'
      +'<button class="qbtn" type="button" data-d="50">+</button>'
    +'</div>'
    +'<button class="qadd" type="button">Додати</button>'
  +'</div>';
}
function wireSidePicker(container){
  container.querySelectorAll('.pickrow[data-sid]').forEach(row=>{
    row.querySelectorAll('.qbtn').forEach(b=>{
      b.onclick=()=>{
        const g = Math.max(50, parseInt(row.dataset.grams)+parseInt(b.dataset.d));
        row.dataset.grams = g;
        row.querySelector('.qgrams').textContent = g;
      };

    row.querySelector('.qadd').onclick=()=>addMenuEntry('side', row.dataset.sid, parseInt(row.dataset.grams));

function openAddMealSheet(mealKey){
  currentAddMeal = mealKey;
  const mealLabel = MEALS.find(m => m[0]===mealKey)[1];
  const lbl = fmtDayLabel(new Date(selectedDate+'T00:00:00'));

  sheet.innerHTML =
    '<div class="grab"></div>'

  sheet.querySelector('.sclose').onclick=closeSheet;
  const segP=sheet.querySelector('#segPantry'), segS=sheet.querySelector('#segSide');

    b.onclick=()=>{

      segS.hidden = b.dataset.seg!=='side';

  segP.innerHTML = availablePantry.length

    : '<p class="hint">Морозилка порожня. Спочатку додай щось на вкладці «Морозилка».</p>';
  wireItemPicker(segP);

  function paintSideSeg(){
    segS.innerHTML = sides.map(sidePickerRow).join('')
      +'<button class="newside" type="button" id="newSideBtn">+ Новий гарнір</button>'
      +'<div class="sideform" id="sideForm" hidden>'
        +'<input class="sfield" type="text" id="sfName" placeholder="Назва (напр. гречка)">'
        +'<div class="sgrid">'
          +'<input class="sfield" type="number" inputmode="numeric" id="sfGrams" placeholder="Грамів" value="150">'
          +'<input class="sfield" type="number" inputmode="decimal" id="sfKcal" placeholder="Ккал/100г">'
          +'<input class="sfield" type="number" inputmode="decimal" id="sfProt" placeholder="Білки/100г">'
          +'<input class="sfield" type="number" inputmode="decimal" id="sfFat" placeholder="Жири/100г">'

        +'</div>'

      const grams = parseInt(segS.querySelector('#sfGrams').value)||150;
      const num = sel => { const v=segS.querySelector(sel).value; return v===''?null:parseFloat(v); };
      await createSide(name, grams, num('#sfKcal'), num('#sfProt'), num('#sfFat'), num('#sfCarbs'));
      paintSideSeg();
    };
  }
  paintSideSeg();

  sheet.classList.add('on'); scrim.classList.add('on');
  document.body.style.overflow='hidden';

  let html='';
  DATA.categories.forEach(cat=>{
    const rows = byCat[cat.id]; if (!rows || !rows.length) return;
    html += '<div class="shopcat"><div class="mealhead">'+esc(cat.name)+'</div>';
    rows.forEach(({row,it})=>{
      const p = it.producer==='galya'?'gb':'su';
      html += '<div class="shoprow '+p+'">'
        +'<span class="pbadge">'+PROD[it.producer].short+'</span>'
        +'<span class="shopname">'+esc(it.name)+'</span>'
        +'<div class="pickqty small">'
          +'<button class="qbtn" type="button" data-id="'+row.id+'" data-d="-1">−</button>'
          +'<span class="qval"><b>'+row.packs+'</b>×</span>'
          +'<button class="qbtn" type="button" data-id="'+row.id+'" data-d="1">+</button>'
        +'</div>'
        +'<span class="shopsum">'+Math.round(it.packPrice*row.packs)+' ₴</span>'
      +'</div>';
    });
    html += '</div>';
  });
  root.innerHTML = html;
  root.querySelectorAll('.qbtn').forEach(b=>{
    b.onclick=()=>{
      const row = shopping.find(s => s.id===b.dataset.id);
      if (row) adjustShoppingPacks(row, parseInt(b.dataset.d));
    };
  });

  let sumHtml='';
  ['galya','samudoma'].forEach(pk=>{
    const rows = shopping.filter(s => { const it=findCatalogItem(s.item_id); return it && it.producer===pk; });
    if (!rows.length) return;
    const total = rows.reduce((a,s) => { const it=findCatalogItem(s.item_id); return a + it.packPrice*s.packs; }, 0);
    const prod = PROD[pk];
    let note = null;
    if (prod.minOrder!=null && total < prod.minOrder){
      note = {cls:'warn', text:'Ще '+Math.ceil(prod.minOrder-total)+' ₴ до мінімального замовлення ('+prod.minOrder+' ₴)'};
    } else if (prod.freeFrom!=null && total < prod.freeFrom){
      note = {cls:'warn', text:'Доставка '+prod.deliveryFee+' ₴ · ще '+Math.ceil(prod.freeFrom-total)+' ₴ до безкоштовної ('+prod.freeFrom+' ₴)'};
    } else if (prod.freeFrom!=null){
      note = {cls:'ok', text:'Безкоштовна доставка'};
    }
    sumHtml += '<div class="shopsummary '+(pk==='galya'?'gb':'su')+'">'
      +'<div class="ssname">'+esc(prod.name)+'</div>'
      +'<div class="sstotal">'+Math.round(total)+' ₴ <span class="sscount">· '+rows.length+' поз.</span></div>'
      +(note?'<div class="ssnote '+note.cls+'">'+esc(note.text)+'</div>':'')
      +'<div class="ssactions">'
        +'<a class="buy '+(pk==='galya'?'gb':'su')+'" href="'+prod.url+'" target="_blank" rel="noopener">Відкрити '+esc(prod.name)+'</a>'
        +'<button class="ssclear" type="button" data-p="'+pk+'">Очистити</button>'
      +'</div>'
    +'</div>';
  });
  sumRoot.innerHTML = sumHtml;
  sumRoot.querySelectorAll('.ssclear').forEach(b=>{
    b.onclick=()=>{ if (confirm('Очистити список для '+PROD[b.dataset.p].name+'?')) clearShoppingForProducer(b.dataset.p); };
  });
}

/* ── старт ────────────────────────────────── */
render();
renderPantry();
renderWeekNav();
renderDay();
renderPeriodChips();
renderShopping();
if (getRoom()){
  Promise.all([pullFavorites(), loadPantry(), loadSides(), loadMenu(), loadShopping()]).then(()=>{
    render(); renderPantry(); renderWeekNav(); renderDay(); renderShopping();
  });
}
</script>
</body>
</html>
